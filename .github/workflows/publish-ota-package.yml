name: Publish OTA package to release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag'
        required: true
        default: 'originals'
      url:
        description: 'OTA zip URL'
        required: true
      size:
        description: 'Expected size in bytes'
        required: true
      asset_name:
        description: 'File name inside the release'
        required: false
        default: 'ota.zip'
      chunk_mb:
        description: 'Chunk size in MiB'
        required: false
        default: '1500'
      checksum_name:
        description: 'Checksum file name'
        required: false
        default: 'SHA256SUMS-extra.txt'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 200
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Download and split
        env:
          NAME: ${{ inputs.asset_name }}
          CHUNK_MB: ${{ inputs.chunk_mb }}
          EXPECT: ${{ inputs.size }}
        run: |
          set -euo pipefail
          mkdir -p src dist
          curl -fL --retry 20 --retry-all-errors --retry-delay 5 -C - -o "src/$NAME" "${{ inputs.url }}"
          test "$(stat -c %s "src/$NAME")" = "$EXPECT"
          CHUNK=$((CHUNK_MB * 1024 * 1024))
          SIZE=$(stat -c %s "src/$NAME")
          if [ "$SIZE" -gt "$CHUNK" ]; then
            split -b "$CHUNK" -d -a 3 --numeric-suffixes=1 "src/$NAME" "dist/$NAME."
          else
            cp "src/$NAME" "dist/$NAME"
          fi
          rm -rf src
          cd dist
          sha256sum ./* | grep -v " ${{ inputs.checksum_name }}$" > "${{ inputs.checksum_name }}"
          cat "${{ inputs.checksum_name }}"
          ls -lh
          df -h /

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ inputs.tag }}" dist/* \
            --repo "${{ github.repository }}" --clobber
          gh release view "${{ inputs.tag }}" --repo "${{ github.repository }}" --json assets \
            --jq '.assets[] | "\(.name) \(.size)"'
