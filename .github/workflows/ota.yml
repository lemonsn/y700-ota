name: TB322FC 259 -> 358

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag'
        required: true
        default: 'v358'
      resign:
        description: 'Re-sign AVB images (keep false for the official 259 -> 358 package)'
        type: boolean
        default: false
      key_name:
        description: 'Deprecated: the workflow signs with keys/testkey_rsa4096.pem (or the RESIGN_KEY_PEM secret)'
        required: false
        default: 'testkey_rsa4096'

permissions:
  contents: write

concurrency:
  group: tb322fc-${{ inputs.tag }}
  cancel-in-progress: false

env:
  BASE_URL: 'http://zsk-cdn.lenovows.com/%E7%9F%A5%E8%AF%86%E5%BA%93/Flash_tool_image/TB322_ZUXOS_1.5.10.259_Tool.7z'
  BASE_SIZE: '10219346474'
  OTA_URL: 'https://otanew-cdn.lenovo.com/firmware/20269121142256-9170.zip'
  OTA_SIZE: '319935310'
  DYNOBOX_URL: 'https://github.com/miner7222/DynoBox/releases/download/v0.3.6/DynoBox-linux_x86_64-v0.3.6.tar.gz'
  DYNOBOX_SHA256: '8f51fdddabfb99f739225713a83e47533595ad8685eb0acc9bdc9a7efc868448'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Install 7-Zip
        run: |
          curl -fsSL --retry 5 -o /tmp/7z.tar.xz https://www.7-zip.org/a/7z2501-linux-x64.tar.xz
          sudo tar -xJf /tmp/7z.tar.xz -C /usr/local/bin 7zz
          sudo chmod 0755 /usr/local/bin/7zz
          7zz | head -3
          df -h /

      - name: Download DynoBox
        run: |
          mkdir -p tools
          curl -fsSL --retry 10 -o tools/dynobox.tar.gz "$DYNOBOX_URL"
          echo "$DYNOBOX_SHA256  tools/dynobox.tar.gz" | sha256sum -c -
          tar -xzf tools/dynobox.tar.gz -C tools
          DYN=$(find tools -type f -name dynobox | head -1)
          chmod +x "$DYN"
          echo "DYNOBOX=$PWD/$DYN" >> "$GITHUB_ENV"
          "$PWD/$DYN" --help | head -12

      - name: Download base firmware
        run: |
          curl -fL --retry 20 --retry-all-errors --retry-delay 5 -C - -o "$RUNNER_TEMP/base.7z" "$BASE_URL"
          test "$(stat -c %s "$RUNNER_TEMP/base.7z")" = "$BASE_SIZE"
          ls -l "$RUNNER_TEMP/base.7z"
          df -h /

      - name: Extract base firmware
        env:
          BASE_7Z_PASSWORD: ${{ vars.BASE_7Z_PASSWORD }}
        run: |
          if [ -z "$BASE_7Z_PASSWORD" ]; then
            echo "::error::repository variable BASE_7Z_PASSWORD is not set"
            exit 1
          fi
          7zz x -y -p"$BASE_7Z_PASSWORD" -o"$RUNNER_TEMP/base" "$RUNNER_TEMP/base.7z" -bso0 -bsp0
          rm -f "$RUNNER_TEMP/base.7z"
          IMG_DIR=$(find "$RUNNER_TEMP/base" -name 'rawprogram*.xml' -printf '%h\n' | sort -u | head -1)
          if [ -z "$IMG_DIR" ]; then
            echo "::error::no rawprogram XML found in the extracted firmware"
            exit 1
          fi
          echo "IMG_DIR=$IMG_DIR" >> "$GITHUB_ENV"
          echo "image directory: $IMG_DIR"
          ls -lh "$IMG_DIR" | head -40
          df -h /

      - name: Download OTA package
        run: |
          curl -fL --retry 20 --retry-all-errors --retry-delay 5 -C - -o "$RUNNER_TEMP/ota.zip" "$OTA_URL"
          test "$(stat -c %s "$RUNNER_TEMP/ota.zip")" = "$OTA_SIZE"
          sha256sum "$RUNNER_TEMP/ota.zip"

      - name: Prepare resign key
        if: inputs.resign
        env:
          KEY: ${{ secrets.RESIGN_KEY_PEM }}
        run: |
          if [ -n "$KEY" ]; then
            printf '%s\n' "$KEY" > "$RUNNER_TEMP/resign_key.pem"
            echo "using the RESIGN_KEY_PEM secret"
          else
            cp keys/testkey_rsa4096.pem "$RUNNER_TEMP/resign_key.pem"
            echo "using the bundled AOSP testkey_rsa4096"
          fi
          head -1 "$RUNNER_TEMP/resign_key.pem"
          openssl rsa -in "$RUNNER_TEMP/resign_key.pem" -noout -text | head -1

      - name: Apply OTA
        run: |
          set -o pipefail
          ARGS=(apply --input "$IMG_DIR" --output "$RUNNER_TEMP/out" --repack "$RUNNER_TEMP/ota.zip")
          if [ "${{ inputs.resign }}" = "true" ]; then
            ARGS+=(--resign --key "$RUNNER_TEMP/resign_key.pem")
          fi
          echo "dynobox ${ARGS[*]}"
          set +e
          "$DYNOBOX" "${ARGS[@]}" 2>&1 | tee "$RUNNER_TEMP/apply.log"
          CODE=${PIPESTATUS[0]}
          set -e
          echo "APPLY_EXIT=$CODE" >> "$GITHUB_ENV"
          # Without --resign the AVB verdict is expected to fail (content changed,
          # signatures kept); every other failure aborts the build.
          if [ "$CODE" -ne 0 ]; then
            if [ "${{ inputs.resign }}" = "true" ] || ! grep -q "Verification failed" "$RUNNER_TEMP/apply.log"; then
              echo "::error::dynobox apply failed with exit code $CODE"
              exit "$CODE"
            fi
            echo "::warning::apply exited $CODE on AVB verification only (expected without --resign)"
          fi
          test -d "$RUNNER_TEMP/out"

      - name: Verify output
        run: |
          set +e
          "$DYNOBOX" verify --input "$RUNNER_TEMP/out" 2>&1 | tee "$RUNNER_TEMP/verify.log"
          echo "VERIFY_EXIT=${PIPESTATUS[0]}" >> "$GITHUB_ENV"
          exit 0

      - name: Summarize
        run: |
          {
            echo "## TB322FC 259 -> 358"
            echo ""
            echo "- resign: \`${{ inputs.resign }}\`"
            echo "- dynobox apply exit: \`${APPLY_EXIT}\`"
            echo "- dynobox verify exit: \`${VERIFY_EXIT:-skipped}\`"
            echo ""
            echo "### Output inventory"
            echo '```'
            ls -lh "$RUNNER_TEMP/out" | head -60
            echo '```'
            echo ""
            echo "### Verity / verification tail"
            echo '```'
            tail -n 20 "$RUNNER_TEMP/apply.log" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Compress with 7-Zip (max)
        run: |
          rm -rf "$RUNNER_TEMP/base"
          mkdir -p dist
          cd "$RUNNER_TEMP"
          7zz a -t7z -mx=9 -ms=on -mmt=on -m0=lzma2 -v1900m \
            "$GITHUB_WORKSPACE/dist/TB322FC_259-358.7z" out -bso0 -bsp0
          cd "$GITHUB_WORKSPACE"
          ls -lh dist
          (cd dist && sha256sum ./*.7z.* > SHA256SUMS.txt && cat SHA256SUMS.txt)
          df -h /

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ inputs.tag }}
          path: |
            ${{ runner.temp }}/apply.log
            ${{ runner.temp }}/verify.log
          if-no-files-found: warn
          retention-days: 7

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: 'TB322FC 259 -> 358 (${{ inputs.tag }})'
          fail_on_unmatched_files: true
          files: dist/*
          body: |
            Y700 四代（TB322FC）官方 OTA 259 -> 358 的镜像产物。

            - 底包：TB322_ZUXOS_1.5.10.259_Tool.7z（10,219,346,474 B）
            - OTA：20269121142256-9170.zip（319,935,310 B，A/B 增量，43 个分区）
            - 处理：DynoBox v0.3.6 `apply --repack`，resign=${{ inputs.resign }}
            - 产物：1900 MiB 分卷 7z + SHA256SUMS.txt

            ### 使用

            ```bash
            cat TB322FC_259-358.7z.0* > TB322FC_259-358.7z
            7z x TB322FC_259-358.7z
            ```

            ### 注意

            ${{ inputs.resign && '已重签 AVB。设备 bootloader 必须接受新公钥（可能需要配套 abl.elf），否则拒绝启动。' || '未重签 AVB：分区内容已改变、签名仍是官方 259 的，AVB 摘要校验不通过属于预期，产物适合分析、二次修改或自行重签，不保证可直接启动。' }}
